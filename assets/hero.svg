<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WANT2VIEW CLI hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08070D"/>
      <stop offset="0.48" stop-color="#111025"/>
      <stop offset="1" stop-color="#061E22"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 132) rotate(45) scale(420 300)">
      <stop stop-color="#28D7C7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#28D7C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 430) rotate(20) scale(440 320)">
      <stop stop-color="#7C5CFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="164" y1="512" x2="514" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28D7C7"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="36" fill="url(#glowA)"/>
  <rect width="1280" height="640" rx="36" fill="url(#glowB)"/>
  <path d="M80 532C246 464 355 582 520 504C672 432 744 290 910 330C1045 363 1087 476 1200 414" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(86 84)">
    <rect x="0" y="0" width="148" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="20" y="25" fill="#F7F3FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.4">WANT2VIEW</text>
  </g>
  <text x="86" y="196" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3">
    WANT2VIEW for
  </text>
  <text x="86" y="276" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3">
    Codex and Claude.
  </text>
  <text x="90" y="340" fill="#C8C0E4" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">
    One command creates evidence packs for Codex, Claude, and terminal agents.
  </text>
  <rect x="90" y="470" width="424" height="66" rx="33" fill="url(#accent)"/>
  <text x="122" y="512" fill="#05030C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">
    npx github:kirbudilov01/want2view-cli start
  </text>
  <g filter="url(#shadow)">
    <rect x="660" y="96" width="520" height="420" rx="24" fill="#090813" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="660" y="96" width="520" height="54" rx="24" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="694" cy="123" r="7" fill="#FF6B6B"/>
    <circle cx="718" cy="123" r="7" fill="#FFD166"/>
    <circle cx="742" cy="123" r="7" fill="#28D7C7"/>
    <text x="1038" y="129" fill="#9E95BC" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">TERMINAL</text>
    <text x="700" y="198" fill="#28D7C7" font-family="SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">$ want2view start codex "ugc ads"</text>
    <text x="700" y="244" fill="#F7F3FF" font-family="SFMono-Regular, Consolas, monospace" font-size="20">manifest.json</text>
    <text x="700" y="284" fill="#F7F3FF" font-family="SFMono-Regular, Consolas, monospace" font-size="20">evidence.jsonl</text>
    <text x="700" y="324" fill="#F7F3FF" font-family="SFMono-Regular, Consolas, monospace" font-size="20">codex_tasks.md</text>
    <text x="700" y="390" fill="#28D7C7" font-family="SFMono-Regular, Consolas, monospace" font-size="20">$ want2view start claude --channel</text>
    <text x="700" y="430" fill="#B9AFD6" font-family="SFMono-Regular, Consolas, monospace" font-size="18">WANT2VIEW Cloud + API access</text>
  </g>
</svg>
