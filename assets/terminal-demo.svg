<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090713"/>
      <stop offset="0.55" stop-color="#15081f"/>
      <stop offset="1" stop-color="#071319"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="86" x2="1015" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.52" stop-color="#28D7C7"/>
      <stop offset="1" stop-color="#FF3B81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.36 0 0 0 0 1 0 0 0 0.55 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M87 402C210 185 417 109 587 199C733 276 819 138 989 86" stroke="url(#accent)" stroke-width="2" opacity="0.24"/>
