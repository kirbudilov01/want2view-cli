<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" rx="34" fill="#08070D"/>
  <circle cx="190" cy="120" r="280" fill="#7C5CFF" fill-opacity="0.18"/>
  <circle cx="1080" cy="600" r="340" fill="#28D7C7" fill-opacity="0.1"/>
  <text x="80" y="105" fill="#C7B8FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="4">WANT2VIEW API ACCESS</text>
  <text x="80" y="176" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">Two keys. Two product surfaces.</text>
  <text x="80" y="230" fill="#BFB5DC" font-family="Inter, Arial, sans-serif" font-size="24">Use CLI tokens for account research runs. Use public API keys for private projects and reports.</text>
  <g transform="translate(80 300)">
    <rect width="520" height="270" rx="24" fill="#121020" stroke="#2E2546"/>
    <text x="34" y="56" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">Developer CLI token</text>
    <text x="34" y="102" fill="#BFB5DC" font-family="Inter, Arial, sans-serif" font-size="21">For managed social connectors and account runs.</text>
    <rect x="34" y="138" width="452" height="54" rx="14" fill="#08070D" stroke="#2E2546"/>
    <text x="56" y="172" fill="#8E72FF" font-family="SFMono-Regular, Consolas, monospace" font-size="19">WANT2VIEW_API_TOKEN=w2v_...</text>
    <rect x="34" y="214" width="210" height="40" rx="20" fill="#F7F2FF"/>
    <text x="70" y="240" fill="#08070D" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Cloud research</text>
  </g>
  <g transform="translate(680 300)">
    <rect width="520" height="270" rx="24" fill="#121020" stroke="#2E2546"/>
    <text x="34" y="56" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">Public API key</text>
    <text x="34" y="102" fill="#BFB5DC" font-family="Inter, Arial, sans-serif" font-size="21">For private projects, reports, and exports.</text>
    <rect x="34" y="138" width="452" height="54" rx="14" fill="#08070D" stroke="#2E2546"/>
    <text x="56" y="172" fill="#28D7C7" font-family="SFMono-Regular, Consolas, monospace" font-size="19">WANT2VIEW_PUBLIC_API_KEY=...</text>
    <rect x="34" y="214" width="210" height="40" rx="20" fill="#8E72FF"/>
    <text x="70" y="240" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Project export</text>
  </g>
</svg>
